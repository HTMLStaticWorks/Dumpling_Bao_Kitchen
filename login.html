
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bamboo & Flour</title>
    <meta name="description" content="Sign in to your account.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        orange: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        },
                        stone: {
                            50: '#fafaf9',
                            800: '#292524',
                            900: '#1c1917',
                            950: '#0c0a09',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-stone-50 text-stone-900 dark:bg-stone-900 dark:text-stone-100 transition-colors duration-300 antialiased selection:bg-orange-200 selection:text-orange-900 flex flex-col min-h-screen">
    <script>
        // Inline script to prevent FOUC for theme and RTL
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        if (localStorage.getItem('dir') === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
        }
    </script>
<!-- Controls -->
<div class="fixed top-4 right-4 z-50 flex items-center gap-2">
    <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center text-stone-500 dark:text-stone-400 hover:text-orange-600 dark:text-stone-400 dark:hover:text-orange-400 transition-colors border border-stone-200 dark:border-stone-700 rounded-md bg-white dark:bg-stone-900 shadow-sm" aria-label="Toggle Theme">
        <svg class="w-4 h-4 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <svg class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    </button>
    <button id="rtl-toggle" class="w-9 h-9 flex items-center justify-center text-stone-500 dark:text-stone-400 hover:text-orange-600 dark:text-stone-400 dark:hover:text-orange-400 transition-colors font-medium text-xs border border-stone-200 dark:border-stone-700 rounded-md bg-white dark:bg-stone-900 shadow-sm" aria-label="Toggle RTL">RTL</button>
</div>
<main class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

<div class="w-full max-w-md bg-white dark:bg-stone-900 rounded-2xl shadow-xl border border-stone-100 dark:border-stone-200 dark:border-stone-800 p-8 m-4">
    <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-2 mb-6 group">
            <svg class="w-10 h-10 text-orange-600 dark:text-orange-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="12" width="16" height="8" rx="2" />
                <path d="M2 12h20" />
                <path d="M6 12C6 8 8 6 12 6s6 2 6 6" />
                <path d="M10 6V4h4v2" />
                <path d="M9 2s1 1 1 2-1 1-1 2" />
                <path d="M15 2s1 1 1 2-1 1-1 2" />
            </svg>
            <span class="font-serif text-2xl font-bold text-stone-900 dark:text-white group-hover:text-orange-600 dark:group-hover:text-orange-500 transition-colors whitespace-nowrap">Bamboo & Flour</span>
        </a>
        <h1 class="text-xl font-serif font-bold text-stone-900 dark:text-white mt-4">Sign in to Bamboo & Flour</h1>
        <p class="text-stone-600 dark:text-stone-400 mt-2 text-sm">Access your orders and saved favorites.</p>
    </div>

    <form class="space-y-6" onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div>
            <label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2">Email Address</label>
            <input type="email" required class="w-full px-4 py-3 rounded-lg border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500 transition-shadow">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2">Password</label>
            <div class="relative">
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500 transition-shadow">
                <button type="button" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';" class="absolute right-3 top-3 text-stone-400 hover:text-stone-600 dark:hover:text-stone-300">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
        </div>

        <div class="flex justify-between items-center">
            <div class="flex items-center">
                <input type="checkbox" id="remember" class="h-4 w-4 text-orange-600 focus:ring-orange-500 border-stone-300 rounded">
                <label for="remember" class="ml-2 block text-sm text-stone-700 dark:text-stone-300">Remember me</label>
            </div>
            <a href="#" class="text-sm font-medium text-orange-600 hover:text-orange-500">Forgot Password?</a>
        </div>

        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white px-4 py-3 rounded-lg font-bold transition-colors shadow-md">Sign In</button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-stone-200 dark:border-stone-700"></div></div>
        <div class="relative flex justify-center text-xs uppercase">
            <span class="px-3 bg-white dark:bg-stone-900 text-stone-400 tracking-wider">Or continue with</span>
        </div>
    </div>

    <!-- Social Buttons -->
    <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="alert('Google Sign-In coming soon!')" class="flex items-center justify-center gap-2 w-full px-4 py-2.5 border border-stone-200 dark:border-stone-700 rounded-lg bg-white dark:bg-stone-800 hover:bg-stone-50 dark:hover:bg-stone-700 transition-colors text-sm font-medium text-stone-700 dark:text-stone-200 shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
        </button>
        <button type="button" onclick="alert('Apple Sign-In coming soon!')" class="flex items-center justify-center gap-2 w-full px-4 py-2.5 border border-stone-200 dark:border-stone-700 rounded-lg bg-white dark:bg-stone-800 hover:bg-stone-50 dark:hover:bg-stone-700 transition-colors text-sm font-medium text-stone-700 dark:text-stone-200 shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Apple
        </button>
    </div>

    <div class="mt-8 text-center text-sm text-stone-600 dark:text-stone-400">
        Don't have an account? <a href="signup.html" class="font-medium text-orange-600 hover:text-orange-500">Sign Up</a>
    </div>

</div>
</main>
    <script src="assets/js/main.js"></script>
</body>
</html>
